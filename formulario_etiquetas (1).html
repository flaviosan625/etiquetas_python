<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ordem de separação — etiquetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE8DA;
    --paper-dark: #E2DBC8;
    --ink: #2A2722;
    --ink-soft: #6B6656;
    --amber: #D98E2B;
    --amber-dark: #8A5A16;
    --teal: #3C6E63;
    --teal-dark: #24443C;
    --line: rgba(42,39,34,0.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#C9C2AC;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    padding:40px 16px;
    display:flex;
    justify-content:center;
  }
  .ticket{
    width:100%;
    max-width:520px;
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:0 12px 0 -6px rgba(0,0,0,0.06), 0 18px 30px rgba(0,0,0,0.18);
    position:relative;
    padding:0 0 28px;
  }
  .perf{
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    transform:translateY(-6px);
  }
  .perf span{
    width:11px;height:11px;border-radius:50%;
    background:#C9C2AC;
    display:block;
  }
  .head{
    padding:26px 30px 18px;
    border-bottom:2px dashed var(--line);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--teal-dark);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:.02em;
    margin:0 0 4px;
    color:var(--ink);
  }
  .sub{
    font-size:12px;
    color:var(--ink-soft);
    margin:0;
  }
  .materiais{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:16px 30px 0;
  }
  .chip{
    font-family:'Oswald', sans-serif;
    font-size:11px;
    letter-spacing:.05em;
    padding:4px 10px;
    border:1px solid var(--amber-dark);
    color:var(--amber-dark);
    background:rgba(217,142,43,0.10);
  }
  form{padding:20px 30px 0;}
  .campo{margin-bottom:20px;}
  label{
    display:block;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--ink);
    background:transparent;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    padding:6px 2px;
    color:var(--ink);
    outline:none;
  }
  input::placeholder{color:#A9A28E;}
  input:focus{border-bottom:1px solid var(--teal-dark);}
  .erro{
    font-size:11px;
    color:#A32D2D;
    margin-top:4px;
    display:none;
  }
  .campo.invalido .erro{display:block;}
  .campo.invalido input{border-bottom:1px solid #A32D2D;}
  button{
    width:calc(100% - 60px);
    margin:6px 30px 0;
    padding:12px;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:.04em;
    font-size:14px;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    cursor:pointer;
  }
  button:active{transform:translateY(1px);}
  .stamp{
    margin:22px 30px 0;
    border:2px solid var(--teal);
    color:var(--teal-dark);
    padding:14px 16px;
    display:none;
    transform:rotate(-0.6deg);
  }
  .stamp.mostrar{display:block;}
  .stamp-label{
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 8px;
  }
  .comando{
    font-size:12.5px;
    line-height:1.6;
    word-break:break-word;
    margin:0 0 10px;
    color:var(--teal-dark);
  }
  .copiar{
    width:auto;
    margin:0;
    padding:6px 14px;
    background:transparent;
    color:var(--teal-dark);
    border:1px solid var(--teal);
    font-size:11px;
  }
  .copiado{color:var(--amber-dark);}
</style>
</head>
<body>

<div class="ticket">
  <div class="perf" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="head">
    <p class="eyebrow">Ordem de separação · etiquetas</p>
    <h1>Preencher antes de gerar</h1>
    <p class="sub">Os dados abaixo entram no rodapé de cada etiqueta e no nome dos arquivos.</p>
  </div>

  <div class="materiais">
    <span class="chip">Lona</span>
    <span class="chip">Adesivo</span>
    <span class="chip">PVC</span>
    <span class="chip">PS</span>
    <span class="chip">MDF</span>
  </div>

  <form id="formEtiquetas">
    <div class="campo" id="campo-cliente">
      <label for="cliente">Cliente</label>
      <input type="text" id="cliente" placeholder="TIKTOK">
      <p class="erro">Informe o nome do cliente.</p>
    </div>
    <div class="campo" id="campo-gerente">
      <label for="gerente">Gerente operacional</label>
      <input type="text" id="gerente" placeholder="Flavio Santos">
      <p class="erro">Informe o gerente operacional.</p>
    </div>
    <div class="campo" id="campo-produtor">
      <label for="produtor">Produtor responsável</label>
      <input type="text" id="produtor" placeholder="Bia">
      <p class="erro">Informe o produtor responsável.</p>
    </div>
    <div class="campo" id="campo-pasta">
      <label for="pasta">Pasta de entrada</label>
      <input type="text" id="pasta" placeholder="entrada">
      <p class="erro">Informe a pasta de entrada.</p>
    </div>
    <button type="submit">Gerar comando</button>
  </form>

  <div class="stamp" id="stamp">
    <p class="stamp-label">Comando pronto</p>
    <p class="comando" id="comandoTexto"></p>
    <button class="copiar" id="btnCopiar" type="button">Copiar comando</button>
  </div>
</div>

<script>
  const form = document.getElementById('formEtiquetas');
  const stamp = document.getElementById('stamp');
  const comandoTexto = document.getElementById('comandoTexto');
  const btnCopiar = document.getElementById('btnCopiar');

  const campos = [
    { id: 'cliente', campo: 'campo-cliente' },
    { id: 'gerente', campo: 'campo-gerente' },
    { id: 'produtor', campo: 'campo-produtor' },
    { id: 'pasta', campo: 'campo-pasta' }
  ];

  campos.forEach(function(c){
    document.getElementById(c.id).addEventListener('input', function(){
      document.getElementById(c.campo).classList.remove('invalido');
    });
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    let valido = true;
    const valores = {};

    campos.forEach(function(c){
      const el = document.getElementById(c.id);
      const val = el.value.trim();
      if(!val){
        document.getElementById(c.campo).classList.add('invalido');
        valido = false;
      } else {
        document.getElementById(c.campo).classList.remove('invalido');
        valores[c.id] = val;
      }
    });

    if(!valido){
      stamp.classList.remove('mostrar');
      return;
    }

    const cmd = 'uv run main.py --pasta-entrada "' + valores.pasta +
      '" --cliente "' + valores.cliente +
      '" --gerente "' + valores.gerente +
      '" --produtor "' + valores.produtor + '"';

    comandoTexto.textContent = cmd;
    stamp.classList.add('mostrar');
    btnCopiar.textContent = 'Copiar comando';
    btnCopiar.classList.remove('copiado');
  });

  btnCopiar.addEventListener('click', function(){
    navigator.clipboard.writeText(comandoTexto.textContent).then(function(){
      btnCopiar.textContent = 'Copiado';
      btnCopiar.classList.add('copiado');
    });
  });
</script>

</body>
</html>
